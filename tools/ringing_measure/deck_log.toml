# captures
# ---------------------------------------------------------------------------
# timestamp_discipline is one of gps | ntp | none. Every timestamp below is
# a file modification time - the END of the write on a clock nobody checked
# - so it is "none". The readme dates the test-pattern session 2025-07-12,
# and the modification times (UTC) fall on the evening of that date in the
# United States, which is consistent but is not a disciplined clock.

